<!-- Link-unfurl tags. Crawlers read only this static HTML (no JS), so every URL
     shares one generic preview; per-service previews would need generated pages.
     og:url and og:image are absolute because relative URLs don't resolve for
     crawlers. The card itself is rendered from design/og.html — see
     scripts/make-images.mjs. -->

<meta property="og:type" content="website">
<meta property="og:site_name" content="Oxford Evensong">
